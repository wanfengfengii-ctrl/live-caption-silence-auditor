services:
  api:
    build:
      context: ./api
    image: subtitle-gap-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: subtitle-gap-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    # The web container is healthy as soon as nginx serves the page itself.
    # Probe 127.0.0.1 explicitly: in nginx:alpine busybox wget resolves
    # "localhost" to ::1 first, and nginx is not required to listen on
    # IPv6 — that made the container report unhealthy forever and the
    # one-off `verify` service (which waits for service_healthy) never
    # start. The real Web -> /api -> API integration is exercised by the
    # `verify` service itself, not coupled to this healthcheck.
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1/ | grep -q '<div id=\"root\"></div>'"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-off acceptance service, kept off the default project so that
  # `docker compose up` runs ONLY web and api. Run it explicitly:
  #   docker compose --profile verify run --rm verify
  # or build+run the whole stack with the one-off exit:
  #   docker compose --profile verify up --build --abort-on-container-exit \
  #       --exit-code-from verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: subtitle-gap-verify
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"
